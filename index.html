<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>imagesby.ai</title>

<meta name="description" content="imagesby.ai – Fast AI image generator using Pollinations">
<meta property="og:title" content="imagesby.ai">
<meta property="og:description" content="Generate AI images instantly">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://image.pollinations.ai">
<link rel="dns-prefetch" href="https://image.pollinations.ai">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
font-family:system-ui,-apple-system,BlinkMacSystemFont;
background:#0a0a0a;color:#fff;min-height:100vh}
.container{max-width:1100px;margin:auto;padding:2rem}
h1{text-align:center;font-size:3rem;margin-bottom:.5rem}
p{text-align:center;color:#aaa;margin-bottom:1.5rem}
textarea,select,button{
width:100%;padding:1rem;border-radius:8px;
border:1px solid #333;background:#111;color:#fff}
button{background:#4a9eff;font-weight:600;cursor:pointer}
button:disabled{background:#333}
.controls{
display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
gap:1rem;margin:1rem 0}
#status{text-align:center;margin-top:1rem;color:#4a9eff}
.grid{
display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:1rem;margin-top:2rem}
.card{background:#111;border-radius:8px;overflow:hidden}
.card img{width:100%;height:300px;object-fit:cover}
.info{padding:.75rem;font-size:.85rem;color:#ccc}
</style>
</head>

<body>
<div class="container">

<h1>imagesby.ai</h1>
<p>Fast AI image generation in your browser</p>

<textarea id="prompt" placeholder="Describe your image..."></textarea>

<div class="controls">
<select id="style">
<option value="realistic">Realistic</option>
<option value="artistic">Artistic</option>
<option value="cyberpunk">Cyberpunk</option>
<option value="cartoon">Cartoon</option>
</select>

<select id="resolution">
<option value="512x512" selected>512×512</option>
<option value="768x768">768×768</option>
<option value="1024x1024">1024×1024</option>
</select>

<select id="count">
<option value="1" selected>1 Image</option>
<option value="2">2 Images</option>
<option value="4">4 Images</option>
</select>
</div>

<button id="generate">Generate Images</button>

<div id="status"></div>
<div id="results" class="grid"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const promptInput = document.getElementById("prompt");
const results = document.getElementById("results");
const status = document.getElementById("status");
const button = document.getElementById("generate");

button.addEventListener("click", generateImages);

function generateImages(){
const prompt = promptInput.value.trim();
if(!prompt){
status.textContent = "Please enter a prompt.";
return;
}

button.disabled = true;
status.textContent = "Generating images…";
results.innerHTML = "";

const style = document.getElementById("style").value;
const [w,h] = document.getElementById("resolution").value.split("x");
const count = parseInt(document.getElementById("count").value);

for(let i=0;i<count;i++){
const imgUrl =
`https://image.pollinations.ai/prompt/${encodeURIComponent(prompt + ", " + style + " style")}` +
`?width=${w}&height=${h}&seed=${i}&nologo=true`;

const card = document.createElement("div");
card.className = "card";
card.innerHTML = `
<img src="${imgUrl}" loading="lazy" decoding="async">
<div class="info">${prompt}</div>
`;

results.appendChild(card);
}

status.textContent = "Done ✔";
button.disabled = false;
}

});
</script>

</body>
</html>
